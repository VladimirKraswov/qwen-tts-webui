services:
  tts:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./frontend:/frontend
      - tts-cache:/root/.cache/huggingface
      - book-uploads:/tmp/book_uploads
    environment:
      TTS_MODEL: Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice
      TTS_DEVICE: cuda:0
      TTS_DTYPE: bfloat16
      TTS_ATTN: sdpa
      TTS_STREAM_CHUNK_MS: 200
      TTS_DEFAULT_VOICE: Vivian
      TTS_DEFAULT_LANGUAGE: Russian
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    gpus: all

volumes:
  tts-cache:
  book-uploads:
