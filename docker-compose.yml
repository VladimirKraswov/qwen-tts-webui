services:
  tts-base:
    image: qwen-tts-webui-tts-base:latest
    build:
      context: .
      dockerfile: backend/Dockerfile.ai-base
    profiles: ["build-only"]

  tts:
    image: qwen-tts-webui-tts:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      TTS_MODEL: Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
      TTS_DEVICE: cuda:0
      TTS_DTYPE: bfloat16
      TTS_STREAM_EMIT_FRAMES: "6"
      TTS_STREAM_DECODE_WINDOW: "72"
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - tts-cache:/root/.cache/huggingface
      - book-uploads:/tmp/book_uploads
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

volumes:
  tts-cache:
  book-uploads: