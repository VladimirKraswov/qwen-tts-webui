services:
  tts:
    build: ./backend
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - TTS_MODEL=Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
      - TTS_DEVICE=cuda:0
      - TTS_DTYPE=bfloat16
      - TTS_STREAM_EMIT_FRAMES=6
      - TTS_STREAM_DECODE_WINDOW=72
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./frontend:/app/frontend
      - tts-cache:/root/.cache/huggingface
      - book-uploads:/tmp/book_uploads
volumes:
  tts-cache:
  book-uploads: